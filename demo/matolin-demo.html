<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material Outline Internal Label Demo</title>
    <!-- #include virtual="/imports.html" -->
    <script type=importmap >
    {
        "imports": {
            "decked-select/": "../"
        }
    }
    </script>
    <script type=module>
        import 'be-decked-with/😶‍🌫️.js';
        import 'be-valued/💍.js';
    </script>
    <style>

        /* Dark mode styles */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #121212;
                color: white;
            }
        }
    </style>
</head>
<body>
    <select id=select1
        😶‍🌫️-src="decked-select/matolin.html"
        💍
    >
        <button>
            <selectedcontent></selectedcontent>
        </button>
        <option class=nothing-selected value=""><label for=select1>Country</label></option>
        <option class=something-selected value="">None</option>
        <option value="us">United States</option>
        <option value="uk">United Kingdom</option>
        <option value="ca">Canada</option>
        <option value="au">Australia</option>
        <option value="de">Germany</option>
        <option value="fr">France</option>
        <option value="jp">Japan</option>
    </select>

    <select id=select2
        data-label=Country
        😶‍🌫️-src="decked-select/matolin.html"
        multiple size=1
        💍
    >
        <button>
            <selectedcontent></selectedcontent>
        </button>
        <option value=""><label for=select2>Country</label></option>
        <option value="us">United States</option>
        <option value="uk">United Kingdom</option>
        <option value="ca">Canada</option>
        <option value="au">Australia</option>
        <option value="de">Germany</option>
        <option value="fr">France</option>
        <option value="jp">Japan</option>
    </select>

</body>
</html>
